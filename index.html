<style>
/* Layout: full-bleed 3D "photo studio" scene, a contextual hint pill on top, a toy tray of three items at the bottom */
:root{
  --studio:#d9d9d7;
  --studio-top:#e8e8e6;
  --studio-floor:#cbcbc9;
  --ink:#141414;
  --ink-soft:#5c5c5a;
  --glass:rgba(250,250,249,.82);
  --glass-edge:rgba(255,255,255,.95);
  --press:rgba(20,20,20,.07);
  --font-display:"Unbounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --font-ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--studio)}
body{background:linear-gradient(180deg,var(--studio-top) 0%,var(--studio) 46%,var(--studio-floor) 100%)}
body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;color:var(--ink);font-family:var(--font-ui)}
#scene,#fx{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fx{pointer-events:none}
.hint{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translate(-50%,0);max-width:calc(100% - 32px);box-sizing:border-box;padding:11px 18px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-edge);box-shadow:0 6px 24px rgba(0,0,0,.08);font:500 13px/1.25 var(--font-display);letter-spacing:.01em;text-align:center;text-wrap:balance;pointer-events:none;transition:opacity .35s ease,transform .35s ease;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.hint.is-hidden{opacity:0;transform:translate(-50%,-8px)}
.tray{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 18px);pointer-events:none}
.tray-inner{pointer-events:auto;display:flex;gap:10px;padding:6px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-edge);box-shadow:0 8px 26px rgba(0,0,0,.08);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tool{appearance:none;-webkit-appearance:none;border:0;margin:0;background:transparent;display:grid;place-items:center;width:62px;height:62px;padding:0;border-radius:50%;color:var(--ink);touch-action:none;cursor:grab;transition:background-color .15s ease}
.tool svg{width:34px;height:34px;display:block;transition:transform .15s ease}
.tool.is-down{background:var(--press)}
.tool.is-down svg{transform:scale(.88)}
.tool.is-active{background:var(--press);box-shadow:inset 0 0 0 2px var(--ink)}
.tool:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>

/* ---------- pose ---------- */
let tPrev=now(), clockT=0;
function lookAngles(pt,off){
  headPiv.getWorldPosition(tmp); dog.worldToLocal(tmp);
  const l=dog.worldToLocal(pt.clone());
  const dx=l.x-tmp.x,dy=l.y-tmp.y,dz=l.z-tmp.z;
  return {yaw:clamp(Math.atan2(dx,dz),-1.05,1.05),pitch:clamp(Math.atan2(-dy,Math.hypot(dx,dz))+off,-0.22,0.8)};
}
function applyPose(dt,look,lookOffset){
  for(const k of['lie','sit','paw','ear','wagAmp','wagSpd','eyes','tongue','lean','bow','roll','tailUp']){
    const rate=(k==='paw'||k==='eyes')?10:(k==='lie'?2.2:(k==='tongue'?7:5));
    P[k]=damp(P[k],T[k],rate,dt);
  }
  if(D.mode==='wake')P.lie=T.lie;   // the getting-up timeline drives this directly
  // head look
  let yaw=0,pitch=0.05;
  if(look){const a=lookAngles(look,lookOffset);yaw=a.yaw;pitch=a.pitch;}
  P.yaw=damp(P.yaw,yaw,6,dt); P.pitch=damp(P.pitch,pitch,6,dt);

  const run=gait.run, amp=gait.amp, Bn=bones;
  if(D.sideDirect&&(D.mode==='lie'||D.mode==='wake'||(D.mode==='pet'&&D.petLying))){ /* P.side / P.nod come straight from the timelines */ }
  else {D.sideDirect=false; P.side=damp(P.side,T.side,3,dt); P.nod=damp(P.nod,0,6,dt);}
  const SIDE=P.side;
  roller.rotation.z=0;
  const th=0.5*P.sit, bowA=0.2*P.bow;
  const bob=Math.abs(Math.sin(gait.phase))*0.025*amp*(1+run);
  const LIE=P.lie, LIE_DROP=0.27;
  const hp=(-th+bowA+Math.sin(gait.phase*2)*0.04*amp*run)*(1-LIE)*(1-SIDE);            // body pitch: negative = nose up
  Bn.Hips.position.copy(rest.Hips); Bn.Hips.position.y+=Math.sin(clockT*2.1)*0.006*LIE; Bn.Chest.scale.set(1+Math.sin(clockT*1.9)*0.018*SIDE,1+Math.sin(clockT*1.9)*0.012*SIDE,1);
  Bn.Hips.rotation.set(hp,0,(-0.05*P.paw)*(1-SIDE));   // the body no longer sways when petted, so the paws stay put
  const sw=Math.sin(gait.phase)*(0.42+0.2*run)*amp;
  const raise=P.paw*(-1.75-0.25*P.push)+Math.sin(clockT*5.5)*0.07*D.wiggle*P.paw;
  const fl=-hp+sw*(1-P.paw)+raise, fr=-hp-sw;
  Bn.Leg_FL.rotation.set(fl,0,0.3*P.paw);
  Bn.Paw_FL.rotation.set(lerp(-(hp+fl),0.25,P.paw),0,0);
  Bn.Leg_FR.rotation.set(fr,0,-0.04*P.paw);
  Bn.Paw_FR.rotation.set(-(hp+fr),0,0);
  const hindBase={HL:-hp-sw*(1-P.sit),HR:-hp+sw*(1-P.sit)};
  for(const k of['HL','HR']){Bn['Leg_'+k].rotation.set(hindBase[k],0,0);Bn['Paw_'+k].rotation.set(-(hp+hindBase[k]),0,0);}
  // ground contact: front paws planted, hind legs fold to reach the floor
  const settle=(1-clamp(amp,0,1))*(1-SIDE);
  model.position.y=0; dog.updateMatrixWorld(true);
  const pyFR=Bn.Paw_FR.getWorldPosition(tmp).y, pyFL=Bn.Paw_FL.getWorldPosition(tmp).y;
  const front=P.paw>0.3?pyFR:Math.min(pyFR,pyFL);
  model.position.y=(REST_PAW_Y-front)*settle*(1-LIE)+bob+P.jump-LIE_DROP*LIE*(1-SIDE);
  dog.updateMatrixWorld(true);
  if(LIE>0.01){   // front legs stretch forward until the paws rest on the floor
    for(const k of['FL','FR']){
      const leg=Bn['Leg_'+k], paw=Bn['Paw_'+k], base=leg.rotation.x;
      const yAt=a=>{leg.rotation.x=base+a;paw.rotation.x=-(hp+base+a);paw.updateWorldMatrix(true,false);return paw.getWorldPosition(tmp).y;};
      let lo=-1.6,hi=0;
      if(yAt(0)<REST_PAW_Y){for(let i=0;i<9;i++){const mid=(lo+hi)/2;if(yAt(mid)<REST_PAW_Y)hi=mid;else lo=mid;}} else hi=0;
      yAt(hi*LIE);
    }
  }
  for(const k of['HL','HR']){
    const leg=Bn['Leg_'+k], paw=Bn['Paw_'+k];
    const yAt=a=>{leg.rotation.x=hindBase[k]+a;paw.rotation.x=-(hp+hindBase[k]+a);paw.updateWorldMatrix(true,false);return paw.getWorldPosition(tmp).y;};
    let a0=0;
    if(settle>0.01&&yAt(0)<REST_PAW_Y-0.004){let lo=-1.7,hi=0;for(let i=0;i<9;i++){const mid=(lo+hi)/2;if(yAt(mid)<REST_PAW_Y)hi=mid;else lo=mid;}a0=hi;}
    yAt(a0*settle);
  }
  Bn.Head.rotation.set(P.pitch-hp+D.headBob+P.nod,P.yaw*(1-SIDE),P.roll*(1-SIDE)+0.12*SIDE);
  if(SIDE>0.001){   // limp legs once he is on his side
    // front paws curl at the wrist, hind legs drift back; the upper legs sag onto the lower ones
    Bn.Leg_FL.rotation.x+=-0.35*SIDE; Bn.Leg_FR.rotation.x+=-0.15*SIDE;
    Bn.Paw_FL.rotation.x=lerp(Bn.Paw_FL.rotation.x,1.05,SIDE); Bn.Paw_FR.rotation.x=lerp(Bn.Paw_FR.rotation.x,0.85,SIDE);
    Bn.Leg_HL.rotation.x+=0.5*SIDE; Bn.Leg_HR.rotation.x+=0.3*SIDE;
    Bn.Paw_HL.rotation.x=lerp(Bn.Paw_HL.rotation.x,0.75,SIDE); Bn.Paw_HR.rotation.x=lerp(Bn.Paw_HR.rotation.x,0.6,SIDE);
    // gravity: the upper legs (left side, he lies on his right) sink down onto the lower ones
    const sag=clamp((SIDE-0.85)/0.15,0,1); const sagS=sag*sag*(3-2*sag);
    Bn.Leg_FL.rotation.z+=-0.32*SIDE-0.22*sagS; Bn.Leg_HL.rotation.z+=-0.28*SIDE-0.5*sagS;
    Bn.Leg_HL.rotation.x+=-0.12*sagS; Bn.Paw_HL.rotation.z=-0.25*sagS;
    Bn.Leg_FR.rotation.z+=0.14*SIDE; Bn.Leg_HR.rotation.z+=0.12*SIDE+0.08*sagS;
    Bn.Tail.rotation.x+=-0.4*SIDE;
  }
  roller.rotation.z=SIDE*1.5;
  // ears
  earTwitchTimer(dt);
  for(const e of ears){
    e.flick=damp(e.flick,0,6,dt);
    const relax=1-P.ear, tw=twitchValue(e,dt);
    Bn[e.name].rotation.set(-relax*0.45-e.flick*0.28-tw*0.5,e.s*tw*0.25,-e.s*(relax*0.3+tw*0.5));
  }
  // tail
  const wagS=Math.sin(clockT*P.wagSpd)*P.wagAmp*0.75, wagUp=-UP_SIDE*P.wagAmp*0.75*(0.5+0.5*Math.sin(clockT*P.wagSpd));
  Bn.Tail.rotation.set(lerp(-1.2,0,P.tailUp),lerp(wagS,wagUp,clamp(SIDE,0,1)),0);
  // eyes
  D.blinkT-=dt; if(D.blinkT<0){D.blink=0;if(D.blinkT<-0.11){D.blink=1;D.blinkT=rand(2,5);}}
  const open=Math.max(0.12,P.eyes*D.blink);
  for(const k of['Eye_L','Eye_R']){Bn[k].scale.set(1+(1-open)*0.12,open,1);}
  // tongue
  const tg=Math.max(0.001,P.tongue); tongueG.scale.setScalar(tg);
  tongue.position.y=-0.04-Math.sin(clockT*13)*0.005*P.tongue;
  // root
  dog.rotation.y=D.heading;
}

/* ---------- toys physics ---------- */
function releaseBallFromMouth(fwd){

  const dir=new V3(Math.sin(D.heading),0,Math.cos(D.heading));

function updateBall(dt){

  else if(ball.state==='free'){

    if(D.mode==='chase'&&D.t>0.2&&ball.pos.y<0.5){
      const mw=mouthWorld(tmp);
      const hd=Math.hypot(mw.x-ball.pos.x,mw.z-ball.pos.z), rd=Math.hypot(dog.position.x-ball.pos.x,dog.position.z-ball.pos.z);
      if(hd<0.34||(rd<0.6&&v.length()<1.5)){ball.state='mouth';buzz(10);setMode('return');}
    }
  }
  ball.mesh.position.copy(ball.pos);
  ball.blob.position.set(ball.pos.x,0.005,ball.pos.z);
  const hgt=Math.max(0,ball.pos.y-BALL_R); const s=1+hgt*0.6; ball.blob.scale.setScalar(s);
  ball.blob.material.opacity=clamp(1-hgt*0.5,0.2,1);
}
function updateTreat(dt){
  if(treat.state==='none'||treat.state==='gone'){treat.mesh.visible=false;treat.blob.visible=false;return;}
  treat.mesh.visible=true; treat.blob.visible=true;
  if(treat.state==='held'){
    treat.spin+=dt; treat.mesh.rotation.set(0.2,Math.sin(treat.spin*2)*0.25,0.3+Math.sin(treat.spin*3)*0.08);
    if(D.mode==='treatWatch'&&mouthWorld(tmp).distanceTo(treat.pos)<0.34){eatTreat();}
  } else if(treat.state==='fall'){
    treat.vel.y-=9.8*dt; treat.pos.addScaledVector(treat.vel,dt);
    treat.mesh.rotation.x+=dt*6;
    if(treat.pos.y<0.05){treat.pos.y=0.05;treat.state='floor';treat.mesh.rotation.set(0,rand(0,3),0);if(!['chase','return','pawWait','pawSit','pawGo','hf'].includes(D.mode))setMode('goTreat');}
  } else if(treat.state==='slurp'){
    treat.slurpT+=dt; const mw=mouthWorld(tmp);
    treat.pos.lerp(mw,clamp(treat.slurpT*7,0,1));
    if(treat.slurpT>0.18){treat.state='gone';buzz(18);hearts(mw,2);}
  }
  treat.mesh.position.copy(treat.pos);
  treat.blob.position.set(treat.pos.x,0.005,treat.pos.z);
  treat.blob.scale.setScalar(1+treat.pos.y*0.4);
  treat.blob.material.opacity=clamp(1-treat.pos.y*0.45,0.15,1);
}
function eatTreat(){
  treat.state='gone'; buzz([18,30,18]);
  const mw=mouthWorld(); crumbs(mw,6); hearts(mw,1);
  setMode('eat');
}

/* ---------- 2D effects ---------- */
const parts=[];
function heartPath(c,x,y,s){c.beginPath();c.moveTo(x,y+s*0.9);c.bezierCurveTo(x-s*1.25,y+s*0.05,x-s*0.62,y-s*0.95,x,y-s*0.32);c.bezierCurveTo(x+s*0.62,y-s*0.95,x+s*1.25,y+s*0.05,x,y+s*0.9);c.closePath();}
function hearts(worldPt,n,sx,sy){
  const p=worldPt?toScreen(worldPt):{x:sx,y:sy};
  for(let i=0;i<n;i++)parts.push({k:'heart',x:p.x+rand(-14,14),y:p.y+rand(-10,6),vx:rand(-26,26),vy:rand(-95,-60),life:0,max:rand(1.0,1.4),s:rand(8,12),rot:rand(-0.4,0.4),col:Math.random()<0.5?'#ff6f91':'#ff8a3d'});
}
function crumbs(worldPt,n){const p=toScreen(worldPt);for(let i=0;i<n;i++)parts.push({k:'crumb',x:p.x+rand(-6,6),y:p.y+rand(-2,4),vx:rand(-70,70),vy:rand(-110,-30),life:0,max:rand(0.5,0.8),s:rand(2,3.6)});}
function snore(){const p=Bn0('Head');if(!p)return;const s=toScreen(p.getWorldPosition(new V3()));parts.push({k:'z',x:s.x+22,y:s.y-46,vx:14,vy:-26,life:0,max:2.0,s:13});}
const Bn0=k=>bones[k];
function burst(x,y){
  parts.push({k:'ring',x,y,life:0,max:0.5});
  for(let i=0;i<10;i++){const a=i/10*Math.PI*2+rand(-0.2,0.2),sp=rand(170,260);parts.push({k:'spark',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0,max:rand(0.45,0.7),s:rand(5,8),col:i%2?'#ff7a1c':'#ffc54d'});}
}
function drawFx(dt){
  fxc.clearRect(0,0,W,H);
  for(let i=parts.length-1;i>=0;i--){
    const q=parts[i]; q.life+=dt; const u=q.life/q.max; if(u>=1){parts.splice(i,1);continue;}
    if(q.k==='heart'){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=0.97;fxc.save();fxc.globalAlpha=u<0.7?1:(1-u)/0.3;const s=q.s*(u<0.15?u/0.15:1);fxc.translate(q.x,q.y);fxc.rotate(q.rot);heartPath(fxc,0,0,s);fxc.fillStyle=q.col;fxc.fill();fxc.restore();}
    else if(q.k==='crumb'){q.vy+=420*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;fxc.globalAlpha=1-u;fxc.fillStyle='#d8914f';fxc.beginPath();fxc.arc(q.x,q.y,q.s,0,Math.PI*2);fxc.fill();fxc.globalAlpha=1;}
    else if(q.k==='z'){q.x+=q.vx*dt;q.y+=q.vy*dt;fxc.globalAlpha=u<0.2?u/0.2:(1-u)/0.8;fxc.fillStyle='#141414';fxc.font=`800 ${Math.round(q.s*(1+u*0.6))}px Manrope, system-ui, sans-serif`;fxc.fillText('z',q.x,q.y);fxc.globalAlpha=1;}
    else if(q.k==='ring'){fxc.globalAlpha=1-u;fxc.strokeStyle='#ffffff';fxc.lineWidth=5*(1-u)+1;fxc.beginPath();fxc.arc(q.x,q.y,18+u*70,0,Math.PI*2);fxc.stroke();fxc.globalAlpha=1;}
    else if(q.k==='spark'){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=0.9;q.vy*=0.9;fxc.globalAlpha=1-u;fxc.fillStyle=q.col;const s=q.s*(1-u*0.5);fxc.beginPath();fxc.moveTo(q.x,q.y-s);fxc.quadraticCurveTo(q.x,q.y,q.x+s,q.y);fxc.quadraticCurveTo(q.x,q.y,q.x,q.y+s);fxc.quadraticCurveTo(q.x,q.y,q.x-s,q.y);fxc.quadraticCurveTo(q.x,q.y,q.x,q.y-s);fxc.fill();fxc.globalAlpha=1;}
  }
}

/* ---------- input ---------- */
const ptr={id:null,kind:null,x:0,y:0,sx:0,sy:0,t0:0,hist:[],moved:0,heartAcc:0,src:null};
const busy=()=>['chase','return','enter','eat','eatFloor','goTreat','treatWatch','ballWatch'].includes(D.mode);
function hitDog(x,y,list){setRay(x,y);const h=ray.intersectObjects(list||dogMeshes,false);return h[0]||null;}
function pawScreen(){const p=bones.Paw_FL.getWorldPosition(new V3());return toScreen(p);}
function heldPoint(x,y,zPlane,minY){
  setRay(x,y); const o=ray.ray.origin,d=ray.ray.direction;
  let p=null;
  if(Math.abs(d.z)>1e-4){const t=(zPlane-o.z)/d.z;if(t>0)p=o.clone().addScaledVector(d,t);}
  if(!p||p.y<minY){if(d.y<-1e-4){const t=(minY-o.y)/d.y;p=o.clone().addScaledVector(d,t);}else p=p||o.clone().addScaledVector(d,4);}
  p.y=Math.max(minY,p.y); p.z=Math.min(p.z,zPlane);
  const hw=halfW(p.z)-0.1; p.x=clamp(p.x,-hw,hw);
  return p;
}
function startPtr(e,kind,src){
  ptr.id=e.pointerId;ptr.kind=kind;ptr.src=src||null;ptr.x=ptr.sx=e.clientX;ptr.y=ptr.sy=e.clientY;ptr.t0=now();ptr.hist=[{x:e.clientX,y:e.clientY,t:e.timeStamp/1000}];ptr.moved=0;ptr.heartAcc=0;
  try{(src||canvas).setPointerCapture(e.pointerId);}catch(err){}
}
function dropBallIfCarrying(){if(ball.state==='mouth')releaseBallFromMouth(0.4);}

function highFive(){
  const ps=pawScreen(); burst(ps.x,ps.y); Haptics.highFive(); setMode('hf'); tried.paw=true;
  for(const e of ears)e.flick=1;
}

canvas.addEventListener('pointerdown',e=>{
  touched();
  if(ptr.id!==null)return;
  e.preventDefault();
  const x=e.clientX,y=e.clientY;
  if(D.mode==='pawWait'){
    const ps=pawScreen(); const rad=Math.max(80,Math.min(W,H)*0.16);
    if(Math.hypot(ps.x-x,ps.y-y)<rad||hitDog(x,y,pawMeshes)){highFive();startPtr(e,'done');return;}
  }
  if(ball.state==='free'){
    const bs=toScreen(ball.pos); const edge=toScreen(tmp.copy(ball.pos).add(new V3(BALL_R,0,0)));
    const rad=Math.max(46,Math.abs(edge.x-bs.x)*2.2);
    if(Math.hypot(bs.x-x,bs.y-y)<rad){grabBall(e,null);return;}
  }
  const h=hitDog(x,y);
  if(h&&!busy()){startPtr(e,'pet');D.petHit=h.point.clone();return;}
  startPtr(e,'floor');
  const fp=floorAt(x,y); if(fp){D.lookOverride=fp.setY(0.2);D.lookUntil=now()+1.4;}
});

function onMove(e){
  if(e.pointerId!==ptr.id)return;
  if(e.pointerType==='mouse'&&e.buttons===0){onUp(e);return;}   // button was released outside the page
  touched();
  const x=e.clientX,y=e.clientY; const dx=x-ptr.x,dy=y-ptr.y; const d=Math.hypot(dx,dy);
  ptr.x=x;ptr.y=y;ptr.moved+=d; const t=now(), ts=e.timeStamp/1000; ptr.hist.push({x,y,t:ts}); while(ptr.hist.length>2&&ts-ptr.hist[0].t>0.12)ptr.hist.shift();
  if(ptr.kind==='pet'){
    const h=hitDog(x,y);
    if(h&&ptr.moved>8){
      if(D.mode!=='pet'){D.petLying=(D.mode==='lie'&&P.side>0.6);setMode('pet');Haptics.petStart();ptr.purrAcc=0;twitchEar(D.petLying?(Math.random()<0.5?0:1):2,D.petLying?0.6:1,!D.petLying);earNext=rand(1.4,2.5);}
      D.petting=true; D.lastPet=t; tried.pet=true;
      const l=dog.worldToLocal(h.point.clone()); D.petSide=damp(D.petSide,clamp(l.x/0.3,-1,1),8,0.05);
      ptr.heartAcc+=d; if(ptr.heartAcc>70){ptr.heartAcc=0;hearts(null,1,x,y-18);}
      ptr.purrAcc=(ptr.purrAcc||0)+d; if(ptr.purrAcc>40){ptr.purrAcc=0;Haptics.purr();}
    }
  } else if(ptr.kind==='ball'){
    ball.pos.copy(heldPoint(x,y,ball.zPlane,BALL_R+0.02));
    if(y<6||x<4||x>W-4){onUp(e);return;}                          // flicked off the edge: throw now
  } else if(ptr.kind==='treat'){
    treat.pos.copy(heldPoint(x,y,treat.zPlane,0.12));
  } else if(ptr.kind==='floor'){
    const fp=floorAt(x,y); if(fp){D.lookOverride=fp.setY(0.2);D.lookUntil=t+1.4;}
  }
}
function onUp(e){
  if(e.pointerId!==ptr.id)return;
  const t=now(), dur=t-ptr.t0;
  if(ptr.kind==='pet'){
    if(ptr.moved<10&&dur<0.4&&!busy()){D.tiltSign=Math.random()<0.5?-1:1;setMode('boop');for(const q of ears)q.flick=1;hearts(null,1,ptr.x,ptr.y-16);Haptics.boop();tried.pet=true;}
    D.petting=false; D.lastPet=t;
  } else if(ptr.kind==='ball'){
    releaseBall();
  } else if(ptr.kind==='treat'){
    if(treat.state==='held'){treat.state='fall';treat.vel.set(0,0,0);}
  } else if(ptr.kind==='floor'){
    if(ptr.moved<10&&dur<0.4&&['idle','greet','drop','pawSad','goto','pet','boop'].includes(D.mode)){
      const fp=floorAt(ptr.x,ptr.y);
      if(fp){const tgt=fp.clone();tgt.z-=0.55;clampDog(tgt);D.gotoTarget=tgt;setMode('goto');}
    }
  }
  if(ptr.src)ptr.src.classList.remove('is-down');
  ptr.id=null;ptr.kind=null;ptr.src=null;
}
window.addEventListener('pointermove',onMove,{passive:true});
window.addEventListener('pointerup',onUp);
window.addEventListener('pointercancel',onUp);
const endPtr=()=>{if(ptr.id!==null)onUp({pointerId:ptr.id});};
for(const el of[canvas,document.getElementById('toolTreat'),document.getElementById('toolBall')])el.addEventListener('lostpointercapture',e=>{if(e.pointerId===ptr.id)onUp(e);});
document.documentElement.addEventListener('mouseleave',endPtr);
window.addEventListener('blur',endPtr);
document.addEventListener('visibilitychange',()=>{if(document.hidden)endPtr();});

function grabBall(e,src){
  dropBallIfCarrying();
  startPtr(e,'ball',src);
  ball.zPlane=Math.min(zFront,HOME.z+1.3);
  ball.state='held'; ball.mesh.visible=true; ball.blob.visible=true; ball.vel.set(0,0,0);
  ball.pos.copy(heldPoint(e.clientX,e.clientY,ball.zPlane,BALL_R+0.02));
  if(!['enter'].includes(D.mode))setMode('ballWatch');
}
function releaseBall(){
  const h=ptr.hist; let vx=0,vy=0;
  if(h.length>1){const a=h[0],b=h[h.length-1];const dtt=Math.max(0.016,b.t-a.t);vx=(b.x-a.x)/dtt;vy=(b.y-a.y)/dtt;}
  const up=-vy/H, side=vx/W;
  ball.state='free'; ball.restT=0;
  if(up>0.55){
    const p=clamp(up,0.55,4.2);
    ball.vel.set(clamp(side*2.6,-3,3),1.4+p*1.35,-(1.6+p*2.5));
    tried.ball=true; buzz(12);
  } else {
    ball.vel.set(side*0.8,0.2,-0.3);
  }
  if(D.mode!=='enter')setMode('chase');
}

const toolTreat=document.getElementById('toolTreat'), toolBall=document.getElementById('toolBall'), toolPaw=document.getElementById('toolPaw');
toolTreat.addEventListener('pointerdown',e=>{
  touched();
  if(ptr.id!==null)return; e.preventDefault();
  toolTreat.classList.add('is-down');
  dropBallIfCarrying();
  startPtr(e,'treat',toolTreat);
  treat.zPlane=Math.min(zFront-0.1,dog.position.z+0.95);
  treat.state='held'; treat.spin=0;
  treat.pos.copy(heldPoint(e.clientX,e.clientY,treat.zPlane,0.12));
  tried.treat=true;
  if(D.mode!=='enter')setMode('treatWatch');
});
toolBall.addEventListener('pointerdown',e=>{
  touched();
  if(ptr.id!==null)return; e.preventDefault();
  toolBall.classList.add('is-down');
  grabBall(e,toolBall);
});
toolPaw.addEventListener('click',()=>{
  touched();
  if(['pawGo','pawSit','pawWait','hf'].includes(D.mode))return;
  dropBallIfCarrying();
  if(treat.state==='held'||treat.state==='fall'||treat.state==='floor'||treat.state==='slurp'){treat.state='gone';}
  setMode('pawGo'); toolPaw.classList.add('is-active');
});
for(const b of[toolTreat,toolBall,toolPaw]){b.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();touched();if(b===toolPaw)b.click();else if(b===toolTreat){treat.pos.set(dog.position.x,0.9,dog.position.z+0.95);treat.state='fall';treat.vel.set(0,0,0);tried.treat=true;}else{ball.mesh.visible=ball.blob.visible=true;ball.pos.set(0,0.5,zFront-0.2);ball.state='held';ptr.hist=[{x:W/2,y:H*0.8,t:now()-0.08},{x:W/2,y:H*0.4,t:now()}];releaseBall();}}});}

/* ---------- hint ---------- */
let hintKey='', hintIdleSince=0;
function setHint(text,key){
  if(key===hintKey)return; hintKey=key;
  if(!text){hintEl.classList.add('is-hidden');return;}
  hintEl.textContent=text; hintEl.classList.remove('is-hidden');
}
function updateHint(tNow){
  // the only caption left: when he is asleep
  const asleep=D.mode==='lie'&&D.t>SLEEP.asleep || (D.mode==='pet'&&D.petLying);
  return setHint(asleep?'Тсс, Пармезан задремал':'', asleep?'sleep':'none');
}

/* ---------- loop ---------- */
function frame(){
  const tNow=now(); const dt=Math.min(0.05,tNow-tPrev); tPrev=tNow; clockT+=dt;
  const {look,lookOffset}=brain(dt,tNow);
  // integrate movement
  dog.position.x+=Math.sin(D.heading)*D.speed*dt;
  dog.position.z+=Math.cos(D.heading)*D.speed*dt;
  if(D.mode!=='enter')clampDog(dog.position);
  const stepRate=D.speed*7.2+gait.turn*7;
  gait.phase+=stepRate*dt;
  gait.amp=damp(gait.amp,Math.max(clamp(D.speed/0.9,0,1),gait.turn*0.6),8,dt);
  gait.run=damp(gait.run,D.speed>1.9?1:0,4,dt);
  applyPose(dt,look,lookOffset);
  updateAccessories(dt);
  if(D.mode!=='pawSit'&&D.mode!=='pawWait'&&D.mode!=='pawGo')toolPaw.classList.remove('is-active');
  updateBall(dt); updateTreat(dt);
  dogBlob.position.set(dog.position.x,0.004,dog.position.z+0.05);
  dogBlob.scale.set(1-0.1*P.sit,1,1);
  sun.position.copy(dog.position).addScaledVector(KEY_DIR,7); sun.target.position.copy(dog.position);
  floor.position.set(dog.position.x,0,dog.position.z);   // shadow catcher travels with the dog, inside the shadow camera
  renderContactShadow();
  updateHint(tNow);
  renderer.render(scene,camera);
  drawFx(dt);
  requestAnimationFrame(frame);
}
loadDog().then(()=>{window.__dogReady=true;touched();tPrev=now();requestAnimationFrame(frame);}).catch(err=>{console.error(err);hintEl.textContent='Пёсик не загрузился. Обнови страницу.';hintEl.classList.remove('is-hidden');});

})();
</script>
